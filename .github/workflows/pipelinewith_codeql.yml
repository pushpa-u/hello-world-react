name: Pipeline with codeQL 

on:
  push:
    branches:
      - pipeline-with-codeql


env:
  DOCKER_REPO: "codeql"
  DOCKERHUB_USER_ID: "pushpau"
  

jobs:
  pull_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
     

      - name: Get the latest tag from Docker Hub
        id: get_latest_tag
        
        run: |
          token=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" \
          -H "Content-Type: application/json" \
          -d '{"username": "'"${{ secrets.DOCKER_USERNAME }}"'", "password": "'"${{ secrets.DOCKER_PASSWORD }}"'"}' \
           | jq -r .token)
          # Fetch the latest tag from the private repository using the access token
          latest_tag=$(curl -s "https://hub.docker.com/v2/repositories/$DOCKERHUB_USER_ID/$DOCKER_REPO/tags/?page_size=1" \
          -H "Authorization: Bearer $token" | jq -r '.results[0].name')
          echo "Latest tag: $latest_tag"
          echo "LATEST_TAG=$latest_tag" >> $GITHUB_ENV
      - name: Increment Docker image tag
        id: increment_
        run: |
          latest_tag=${{ env.LATEST_TAG }}
          if [[ -z "$latest_tag" ]]; then
            # If no tag is found, start with the first version
            new_tag="v1"
          else
            # Split the version number and increment the patch version
            patch="${latest_tag#v}"
            new_patch=$((patch + 1))
            new_tag="v${new_patch}"
          fi
          echo "NEW_TAG=$new_tag" >> $GITHUB_ENV
          echo "New Docker tag: $new_tag"
      - name: Build Docker image
        run: docker build -t $DOCKERHUB_USER_ID/$DOCKER_REPO:${{ env.NEW_TAG }} --no-cache .

      - name: Push Docker image to Docker Hub
        run: docker push $DOCKERHUB_USER_ID/$DOCKER_REPO:${{ env.NEW_TAG }}
      